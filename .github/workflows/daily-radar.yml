name: Daily Taiwan Stock Radar

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily radar
        run: python daily_scan.py

      - name: Update performance
        run: python performance_tracker.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_cache.json signal_history.json performance_summary.json
          git diff --cached --quiet || git commit -m "chore: update daily radar"
          git push
